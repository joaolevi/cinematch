# Ambiente local. As senhas daqui não valem para produção: veja docs/DEPLOY.md.
name: tastory

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tastory
      POSTGRES_USER: tastory
      POSTGRES_PASSWORD: tastory
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tastory -d tastory"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      TASTORY_DATABASE_URL: postgresql://tastory:tastory@db:5432/tastory
      TASTORY_SECRET_KEY: ${TASTORY_SECRET_KEY:-segredo-apenas-para-uso-local}
      TASTORY_CORS_ORIGINS: http://localhost:5173
      TASTORY_TMDB_API_KEY: ${TASTORY_TMDB_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_SHOW_DEMO_ACCOUNTS: "true"
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
