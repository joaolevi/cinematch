name: CI

on:
  push:
    branches: [main, homol]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # As migrações também rodam num PostgreSQL, o banco do servidor (tests/test_migrations.py)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tastory
          POSTGRES_USER: tastory
          POSTGRES_PASSWORD: tastory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tastory -d tastory"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TASTORY_TEST_POSTGRES_URL: postgresql+psycopg://tastory:tastory@localhost:5432/tastory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
